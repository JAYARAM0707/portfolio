<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#0a1a2a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0.2" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.85" cy="0.75" r="0.45">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#orb1)"/>
  <rect width="1200" height="630" fill="url(#orb2)"/>

  <!-- Subtle grid -->
  <g opacity="0.08">
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>

  <!-- Status pill -->
  <g transform="translate(80, 130)">
    <rect x="0" y="0" width="220" height="42" rx="21" fill="#0ea5e9" fill-opacity="0.12" stroke="#0ea5e9" stroke-opacity="0.5"/>
    <circle cx="22" cy="21" r="5" fill="#22c55e"/>
    <text x="42" y="28" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="2">AVAILABLE FOR WORK</text>
  </g>

  <!-- Main title -->
  <text x="80" y="270" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="92" font-weight="800" fill="#f5f5f5" letter-spacing="-2">Marni Jayaram</text>
  <text x="80" y="380" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="800" fill="url(#accent)" letter-spacing="-1">Mobile App Developer</text>

  <!-- Tagline -->
  <text x="80" y="445" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="22" fill="#a3a3a3">React Native  ·  iOS  ·  Android  ·  AI Integration</text>

  <!-- Tech pills -->
  <g transform="translate(80, 490)">
    <g>
      <rect x="0" y="0" width="120" height="42" rx="8" fill="#0a1a2a" stroke="#3a3a3a"/>
      <text x="60" y="28" font-family="ui-monospace, monospace" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle">React Native</text>
    </g>
    <g transform="translate(135, 0)">
      <rect x="0" y="0" width="105" height="42" rx="8" fill="#0a1a2a" stroke="#3a3a3a"/>
      <text x="52" y="28" font-family="ui-monospace, monospace" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle">JavaScript</text>
    </g>
    <g transform="translate(255, 0)">
      <rect x="0" y="0" width="80" height="42" rx="8" fill="#0a1a2a" stroke="#3a3a3a"/>
      <text x="40" y="28" font-family="ui-monospace, monospace" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle">Python</text>
    </g>
    <g transform="translate(350, 0)">
      <rect x="0" y="0" width="105" height="42" rx="8" fill="#0a1a2a" stroke="#3a3a3a"/>
      <text x="52" y="28" font-family="ui-monospace, monospace" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle">Tailwind</text>
    </g>
  </g>

  <!-- Right-side avatar disc -->
  <g transform="translate(950, 315)">
    <circle cx="0" cy="0" r="180" fill="#0ea5e9" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.3" stroke-dasharray="6 6"/>
    <circle cx="0" cy="0" r="150" fill="url(#accent)"/>
    <text x="0" y="42" font-family="ui-monospace, monospace" font-size="120" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-4">MJ</text>
  </g>

  <!-- Bottom URL -->
  <text x="80" y="595" font-family="ui-monospace, monospace" font-size="16" fill="#525252" letter-spacing="2">PORTFOLIO  ·  marnijayaram.dev</text>
</svg>
